# ==============================================================================
# ReachInbox Email Scheduler – Official Render Blueprint (Free Tier Deployment)
# Schema Specification: Render Blueprints (render.yaml v1)
# ==============================================================================

version: "1"

services:
  # ----------------------------------------------------------------------------
  # 1. FRONTEND: React / Vite Static Site (Free Tier)
  # ----------------------------------------------------------------------------
  - type: web
    name: reachinbox-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Single-Page Application (SPA) Client-Side Route Rewrite
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.19.2
      # Vite compiles environment variables at build-time
      - key: VITE_API_URL
        value: https://reachinbox-backend-5635.onrender.com

  # ----------------------------------------------------------------------------
  # 2. BACKEND: Express API + In-Process BullMQ Worker + Bull Board (Free Tier)
  # ----------------------------------------------------------------------------
  - type: web
    name: reachinbox-backend
    runtime: node
    plan: free # Free tier compute (512 MB RAM, spins down on 15 mins of inactivity)
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.19.2
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://reachinbox-frontend-1ri7.onrender.com

      # PostgreSQL Database Connection from Managed Database
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres
          property: connectionString

      # Render Key Value Connection String (Redis-compatible Valkey URL)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: reachinbox-redis
          property: connectionString

      # Render Key Value Discrete Host & Port (Supported by backend config)
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: reachinbox-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: reachinbox-redis
          property: port

      # BullMQ Worker Concurrency & Rate Limiting Thresholds
      - key: WORKER_CONCURRENCY
        value: 5
      - key: MIN_DELAY_BETWEEN_EMAILS
        value: 2000
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 50

      # Security & Cryptographic Keys
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false # 64-char hex string (32 bytes) entered in Render Dashboard

      # Google OAuth 2.0 Credentials (Secrets entered via Render Dashboard)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://reachinbox-backend-5635.onrender.com/auth/google/callback

      # Slack OAuth 2.0 Credentials (Secrets entered via Render Dashboard)
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_REDIRECT_URI
        value: https://reachinbox-backend-5635.onrender.com/api/slack/callback

      # Elasticsearch URL (Elastic Cloud / Bonsai / External Cluster)
      - key: ELASTICSEARCH_URL
        sync: false

      # Default SMTP Transporter Settings (Ethereal test accounts fallback)
      - key: SMTP_HOST
        value: smtp.ethereal.email
      - key: SMTP_PORT
        value: 587

  # ----------------------------------------------------------------------------
  # 3. KEY VALUE: Render Managed Key Value Store (Free Tier)
  # ----------------------------------------------------------------------------
  - type: keyvalue
    name: reachinbox-redis
    plan: free # Free tier (25 MB RAM, in-memory)
    # noeviction prevents Redis from dropping pending or delayed BullMQ jobs
    maxmemoryPolicy: noeviction
    ipAllowList: [] # Accessible exclusively within Render's private network

# ------------------------------------------------------------------------------
# 4. DATABASE: Render Managed PostgreSQL Database (Free Tier)
# ------------------------------------------------------------------------------
databases:
  - name: reachinbox-postgres
    databaseName: reachinbox_email_scheduler
    user: reachinbox_user
    plan: free # Free tier (256 MB RAM, 1 GB storage, 30-day trial)
    postgresMajorVersion: '16'
