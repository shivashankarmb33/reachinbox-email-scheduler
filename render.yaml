# ==============================================================================
# ReachInbox Email Scheduler – Official Render Blueprint
# Schema Specification: Render Blueprints (render.yaml v1)
# ==============================================================================

version: "1"

services:
  # ----------------------------------------------------------------------------
  # 1. FRONTEND: React / Vite Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: reachinbox-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Single-Page Application (SPA) Client-Side Route Rewrite
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Vite compiles environment variables at build-time
      - key: VITE_API_URL
        value: https://reachinbox-backend.onrender.com

  # ----------------------------------------------------------------------------
  # 2. BACKEND: Express API + In-Process BullMQ Worker + Bull Board Dashboard
  # ----------------------------------------------------------------------------
  - type: web
    name: reachinbox-backend
    runtime: node
    plan: starter # Options: 'starter' (always-on, recommended) or 'free'
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://reachinbox-frontend.onrender.com

      # PostgreSQL Database Connection from Managed Database
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres
          property: connectionString

      # Render Key Value Connection String (Redis-compatible Valkey URL)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: reachinbox-redis
          property: connectionString

      # Render Key Value Discrete Host & Port (Supported by backend config)
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: reachinbox-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: reachinbox-redis
          property: port

      # BullMQ Worker Concurrency & Rate Limiting Thresholds
      - key: WORKER_CONCURRENCY
        value: 5
      - key: MIN_DELAY_BETWEEN_EMAILS
        value: 2000
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 50

      # Security & Cryptographic Keys
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false # 64-char hex string (32 bytes) entered in Render Dashboard

      # Google OAuth 2.0 Credentials (Secrets entered via Render Dashboard)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://reachinbox-backend.onrender.com/auth/google/callback

      # Slack OAuth 2.0 Credentials (Secrets entered via Render Dashboard)
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_REDIRECT_URI
        value: https://reachinbox-backend.onrender.com/api/slack/callback

      # Elasticsearch URL (Elastic Cloud / Bonsai / External Cluster)
      - key: ELASTICSEARCH_URL
        sync: false

      # Default SMTP Transporter Settings (Ethereal test accounts fallback)
      - key: SMTP_HOST
        value: smtp.ethereal.email
      - key: SMTP_PORT
        value: 587

  # ----------------------------------------------------------------------------
  # 3. KEY VALUE: Render Managed Key Value Store (Redis-compatible for BullMQ)
  # ----------------------------------------------------------------------------
  - type: keyvalue
    name: reachinbox-redis
    # Plan Options:
    # - '256mb' (~$7/mo): Persistent disk storage (Recommended for BullMQ queue durability)
    # - 'free': Volatile in-memory (resets on restart, for testing/prototypes)
    plan: 256mb
    # noeviction prevents Redis from dropping pending or delayed BullMQ jobs
    maxmemoryPolicy: noeviction
    ipAllowList: [] # Accessible exclusively within Render's private network

# ------------------------------------------------------------------------------
# 4. DATABASE: Render Managed PostgreSQL Database
# ------------------------------------------------------------------------------
databases:
  - name: reachinbox-postgres
    databaseName: reachinbox_email_scheduler
    user: reachinbox_user
    # Plan Options:
    # - 'basic-256mb' (~$7/mo): Always-on, persistent storage
    # - 'free': 30-day trial instance (resets after 30 days)
    plan: basic-256mb
    postgresMajorVersion: '16'
